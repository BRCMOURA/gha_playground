name: "[AUTOMATICA]Minha Primeira Action Bonita!"

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      teste:
        descrition: Meu primeiro input
        required: True
        type: string



jobs:
  meu-job:
    runs-on: ubuntu-latest

    steps:
      - name: Primeiro Step
        run: |
          echo "Este job foi executado automaticamente por um evento."
          echo "job está rodando em um servidor hospedado pelo GitHub!"
          echo "${{ inputs.teste }}"

  segundo-job:
    runs-on: ubuntu-latest

    steps:
      - name: Git checkout (faz o clone do repo)
        run: |
          echo "Hoje é $(TZ='America/Sao_Paulo' date +'%d/%m/%y %H:%M:%S')"
          echo "Meu repositorio se chama: ${{ github.repository }}"
          ls -la

      - uses: actions/checkout@v6

      - run: ls -la
  
  
  